# CARMEN ablation variants (2026-09-30 확정) — 6 ablation, 기준 포함 10 variant.
# ────────────────────────────────────────────────────────────────
# 각 variant 는 base yaml(_phase1_base.yaml, _phase2_base.yaml) 위에 overrides 만 얹는다.
# scripts/run_ablation.py 가 merge → 임시 config → torchrun. ckpt 는 마지막 epoch 을 쓴다
# (고정 예산 비교 — val loss 로 고르지 않는다).
#
# run_phase2: false 면 Phase 2 skip. phase1.reuse: <variant> 면 그 variant 의 Phase 1 ckpt 로
# Phase 2 를 시작한다(Phase 1 이 기준과 같은 variant 는 학습을 공유).
# 논문 순서: 1 LSCNorm → 2 조건 해상도 → 3 Phase 2 → 4 목적함수 → 5 patch → 6 규모.
#
# ⚠ 모델 규모(06b) 는 CARMEN_GRAD_CKPT=1 필수. batch 는 bstest(bs96/192) 결과로 확정할 것.

variants:
  # ── #0 기준 (CARMEN full) ────────────────────────────────────
  - name: "00_full"
    description: "CARMEN 기준 — LSCNorm(patchls, PPG 게이팅) · Phase 1+2 · MPM+Next+Cross · patch 0.25 s · 174M"
    ablation_group: "baseline"
    phase1:
      overrides:
        exp_name: ablation_00_full_p1
    phase2:
      overrides:
        exp_name: ablation_00_full_p2

  # ── #1 LSCNorm ───────────────────────────────────────────────
  # use_lscnorm=false: cond_proj·modulation zero-freeze → 조건 없는 RMSNorm(학습 affine 도 없음).
  - name: "01_no_lscnorm"
    description: "LSCNorm → 일반 RMSNorm (조건화 없음)"
    ablation_group: "lscnorm"
    phase1:
      overrides:
        model_config: {use_lscnorm: false}
        exp_name: ablation_01_no_lscnorm_p1
    phase2:
      overrides:
        model_config: {use_lscnorm: false}
        exp_name: ablation_01_no_lscnorm_p2

  # ── #2 조건 벡터 시간 해상도 ─────────────────────────────────
  - name: "02_cond_window_only"
    description: "조건 벡터 = 창 통계(loc·scale)만 — patch 상대 통계 제거 (cond_trend_mode none)"
    ablation_group: "cond_resolution"
    phase1:
      overrides:
        model_config: {cond_trend_mode: none}
        exp_name: ablation_02_cond_window_only_p1
    phase2:
      overrides:
        model_config: {cond_trend_mode: none}
        exp_name: ablation_02_cond_window_only_p2

  # ── #3 Any-Variate 사전학습 (Phase 2) ─────────────────────────
  - name: "03_phase1_only"
    description: "Phase 1(Channel-Independent) 만 — Phase 2 생략, 기준 Phase 1 ckpt 공유"
    ablation_group: "phase2"
    run_phase2: false
    phase1:
      reuse: "00_full"

  # ── #4 사전학습 목적함수 ─────────────────────────────────────
  - name: "04a_no_next"
    description: "−Next (beta=0): Block Next Prediction 제거 (Phase 1·2)"
    ablation_group: "objective"
    phase1:
      overrides:
        beta: 0.0
        exp_name: ablation_04a_no_next_p1
    phase2:
      overrides:
        beta: 0.0
        exp_name: ablation_04a_no_next_p2

  - name: "04b_no_cross"
    description: "−Cross (gamma=0): cross-modal 예측 제거 (Phase 2 만 해당, Phase 1 은 기준 공유)"
    ablation_group: "objective"
    phase1:
      reuse: "00_full"
    phase2:
      overrides:
        gamma: 0.0
        learnable_coupling: false   # cross 가 없으면 결합 그래프도 학습할 대상이 없다
        exp_name: ablation_04b_no_cross_p2

  # ── #5 Patch 크기 ────────────────────────────────────────────
  # patch 0.5·1.0 s 에 딸린 항목은 시간 단위를 유지하도록 전부 절반 토큰으로(full_174m·g_graph 규칙).
  # max_length 는 그대로 → 행당 토큰은 절반, 행당 신호 시간은 같다.
  - name: "05a_patch050"
    description: "patch 0.5 s (50 샘플)"
    ablation_group: "patch_size"
    phase1:
      overrides:
        model_config: {patch_size: 50, next_block_size: 12}
        min_patches: 20
        spec_n_ffts: [16, 32]
        block_size_min: 12
        block_size_max: 32
        exp_name: ablation_05a_patch050_p1
    phase2:
      overrides:
        model_config: {patch_size: 50, next_block_size: 12}
        min_patches: 20
        spec_n_ffts: [16, 32]
        block_size_min: 12
        block_size_max: 32
        exp_name: ablation_05a_patch050_p2

  - name: "05b_patch100"
    description: "patch 1.0 s (100 샘플)"
    ablation_group: "patch_size"
    phase1:
      overrides:
        model_config: {patch_size: 100, next_block_size: 6}
        min_patches: 10
        spec_n_ffts: [32, 64]
        block_size_min: 6
        block_size_max: 16
        exp_name: ablation_05b_patch100_p1
    phase2:
      overrides:
        model_config: {patch_size: 100, next_block_size: 6}
        min_patches: 10
        spec_n_ffts: [32, 64]
        block_size_min: 6
        block_size_max: 16
        exp_name: ablation_05b_patch100_p2

  # ── #6 모델 규모 ─────────────────────────────────────────────
  # 기준 174M(d768 x 24 x 12h). 데이터·스케줄·batch 는 기준과 동일(같은 토큰 수).
  - name: "06a_small"
    description: "소형 — d512 x 16층 x 8heads"
    ablation_group: "model_scale"
    phase1:
      overrides:
        model_config: {d_model: 512, num_layers: 16, num_heads: 8}
        exp_name: ablation_06a_small_p1
    phase2:
      overrides:
        model_config: {d_model: 512, num_layers: 16, num_heads: 8}
        exp_name: ablation_06a_small_p2

  - name: "06b_large"
    description: "대형 — d1024 x 32층 x 16heads (CARMEN_GRAD_CKPT=1)"
    ablation_group: "model_scale"
    phase1:
      overrides:
        model_config: {d_model: 1024, num_layers: 32, num_heads: 16}
        exp_name: ablation_06b_large_p1
    phase2:
      overrides:
        model_config: {d_model: 1024, num_layers: 32, num_heads: 16}
        exp_name: ablation_06b_large_p2
