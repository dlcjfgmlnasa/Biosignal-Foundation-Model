# Ablation downstream task catalog
# ─────────────────────────────────────────────────────────────────────
# CARMEN ablation (configs/ablation/variants.yaml) × 4 downstream task
# 를 자동 실행하기 위한 task 정의. scripts/run_ablation_downstream.py 가
# 본 파일을 읽어 (variant × task × fold × mode) 큐를 만들고 각 task 의
# run.py 를 subprocess 로 호출한다.
#
# 매트릭스:
#   - 15 variants (variants.yaml) × 3 dense tasks × 5 folds × 2 modes
#   - + sparse 1 (ich) × `sampling` 그룹만 × 5 folds × 1 mode (linear_probe)
#
# 본 파일은 task 카탈로그만 담는다. variants × task 매트릭스 확장,
# (variant.ablation_group) ∈ task.applies_to_groups 필터링, 실제
# subprocess 호출은 runner 스크립트의 책임.
#
# ─────────────────────────────────────────────────────────────────────
# 인자 시그니처 (각 run.py 의 argparse grep 결과)
# ─────────────────────────────────────────────────────────────────────
#                       hypo    mort    fcst    ich
#   --checkpoint        opt     req     opt     req
#   --model-version     v1/v2   v1/v2   str     v1/v2
#   --data-path         opt     req     opt     req
#   --data-dir          opt     -       -       -
#   --mode              y       y       -       y
#   --lora-rank         y       y       -       y
#   --lora-alpha        y       y       -       y
#   --epochs            y(20)   y(30)   -       y(30)
#   --lr                y       y       -       y
#   --batch-size        y       y       -       y
#   --patch-size        y       y       -       y
#   --out-dir           y       y       y       y
#   --fold              y       y       -       y
#   --n-folds           y       y       -       y
#   --device            y       y       -       y
#
#   task-specific:
#     hypo: --n-cases --window-sec --stride-sec --train-ratio
#           --input-signals --val-split-seed --bootstrap-iters --dummy
#     mort: --max-windows --agg-layers --agg-heads
#     fcst: --signal-type --target-sec --dummy
#     ich:  --eval-mode (standard|loso)
#
# Forecasting (intra_modal_forecast/run.py) 는 fold/n_folds/mode/lora 인자가
# 없다 — eval-only (autoregressive rollout) 이라 linear_probe/lora 구분
# 자체가 없음. ablation runner 는 forecasting 에 대해서는 modes 를 무시
# (혹은 1회만 실행) 하고 fold loop 도 단일 호출로 처리해야 한다.
#
# ─────────────────────────────────────────────────────────────────────
# 데이터 경로
# ─────────────────────────────────────────────────────────────────────
# `${env:DOWNSTREAM_DATA_ROOT}` 는 prepare_data.py 의 결과 .pt 가 모인
# 루트 (server: /data/downstream, local: ./datasets/processed 등 환경별
# 상이). runner 가 env 치환을 수행한다.
#
# prepare_data.py 의 파일명 컨벤션 (확인 결과):
#   hypo: hypotension_{signals}_w{W}s_h{H}min[_fold{F}]_{split}[_chunk{C}].pt
#   mort: mortality_w{W}s[_fold{F}]_{split}_chunk{C}.pt
#   fcst: forecasting_{source}_{signal}_ctx{C}s_tgt{T}s.pt
#   ich:  intracranial_hypertension_{signals}_w{W}s_h{H}min[_fold{F}]_{split}[_chunk{C}].pt
#
# task별 canonical (window, horizon) 은 paper_task_modality.md FINAL spec
# 을 따른다 (project_paper_task_modality.md memory 참조).
#
# ─────────────────────────────────────────────────────────────────────

defaults:
  n_folds: 5
  seed: 42
  device: cuda
  batch_size: 8                # task별 override 가능
  patch_size: 200              # 100Hz × 2s/token (project_patch_sr_decision)
  model_version: v2            # spec v2 SSOT (RESP→Imp/Flow 분리)
  epochs:
    linear_probe: 30
    lora: 30
  lr:
    linear_probe: 1.0e-3
    lora: 1.0e-4
  lora:
    rank: 8
    alpha: 16.0

tasks:
  # ── 1. Hypotension Prediction (Acute) ────────────────────────────
  - name: hypotension
    category: acute_event
    module: downstream.acute_event.hypotension.run
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/hypotension/hypotension_ecg_ppg_abp_w300s_h15min"
    # ↑ paper canonical (Table: ABP/ECG/PPG, window 5min=300s, horizon 15min).
    #   run.py 로더가 prefix 에 _fold{k}_{split}*.pt 를 붙여 chunk 를 glob·concat 한다.
    modes: [linear_probe, lora]
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, sampling, attn_bias]
    epochs:
      linear_probe: 20         # run.py 기본값
      lora: 20                 # lora 는 baseline(00_full)만 돌림 → epoch 20 감당 가능
                               #   (component 비교는 linear_probe, lora 는 ceiling용)
    batch_size:                # per-mode: linear 64 유지(기존 cell 정합),
      linear_probe: 64         #   lora 128 (bf16 autocast 가속 → 더 큰 batch)
      lora: 128
    extra_args:
      window-sec: 300.0        # 5 min (paper canonical)
      stride-sec: 60.0
      train-ratio: 0.7
      input-signals: [ecg, ppg, abp]   # paper canonical (ABP/ECG/PPG)
      bootstrap-iters: 1000

  # ── 2. Mortality Prediction (Outcome) ────────────────────────────
  - name: mortality
    category: outcome
    module: downstream.outcome.mortality.run
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/mortality/mortality_w600s"
    # 실제 파일은 mortality_w600s_fold{F}_{split}_chunk{C}.pt — runner 가
    # fold/chunk 패턴 expand.
    modes: [linear_probe, lora]
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, sampling, attn_bias]
    batch_size: 8              # run.py 기본 (max-windows × patch 큼)
    extra_args:
      max-windows: 24          # session 당 최대 window 수
      agg-layers: 2
      agg-heads: 4

  # ── 3. Postoperative AKI (Outcome) ── DROPPED (2026-06-20) ──────
  # AKI 는 ablation outcome task 에서 제외. 사유: frozen linear-probe 가
  # near-chance(val_auroc≈0.5) — 작은 코호트(train 414명/AKI 60) + 신호 단독
  # (preop Cr/eGFR 없이) 으로 KDIGO 예측은 문헌상으로도 약함. ablation 의
  # outcome 대표 task 는 mortality 로 교체. 되살리려면 주석 해제.
  # - name: aki
  #   category: outcome
  #   module: downstream.outcome.aki.run
  #   data_path: "${env:DOWNSTREAM_DATA_ROOT}/aki/aki_binary_abp_cvp_w600s"
  #   modes: [linear_probe, lora]
  #   applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
  #                       phase_stage, sampling, attn_bias]
  #   batch_size: 16
  #   extra_args:
  #     max-windows: 24
  #     agg-layers: 2
  #     agg-heads: 4

  # ── 3b. Arrhythmia Classification 5-class (Acute) ────────────────
  # MIMIC-III-Ext-PPG, ECG+PPG, 5-class(SR/AF/STACH/SBRAD/AFLT). ECG 직결이라
  # 신뢰도 높은 task. 데이터는 fold 당 완성 파일(arrhythmia_ecg_ppg_fold{F}.pt)이라
  # run.py 가 prefix + --fold 로 해당 fold 파일을 로드(_load_data fold-prefix 지원).
  - name: arrhythmia
    category: acute_event
    module: downstream.acute_event.arrhythmia.run
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/arrhythmia/arrhythmia_ecg_ppg"
    modes: [linear_probe, lora]
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, attn_bias]
    n_folds: 5                 # fold 당 완성 파일 (_fold{F}.pt)
    batch_size: 32
    epochs:
      linear_probe: 20
      lora: 30
    lr:
      linear_probe: 1.0e-3
      lora: 1.0e-4
    extra_args:
      model-version: v2

  # ── 3c. Hypoxemia (Acute, SpO2<90%) ──────────────────────────────
  # ECG+PPG+CO2+AWP, w300s(5min)/h10min (paper canonical). 데이터 fold-chunked
  # (hypoxemia_ecg_ppg_co2_awp_w300s_h10min_fold{F}_{split}_chunk{C}.pt) → prefix
  # + n_folds=5. run.py _load_data 가 load_prepared_split_chunked 로 fold 로드.
  - name: hypoxemia
    category: acute_event
    module: downstream.acute_event.hypoxemia.run
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/hypoxemia/hypoxemia_ecg_ppg_co2_awp_w300s_h10min"
    modes: [linear_probe]
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, attn_bias]
    n_folds: 5
    batch_size: 32
    epochs:
      linear_probe: 20
    lr:
      linear_probe: 1.0e-3
    extra_args:
      model-version: v2

  # ── 4. Waveform Forecasting (Generation) ─────────────────────────
  - name: waveform_forecasting
    category: generation
    module: downstream.generation.intra_modal_forecast.run
    # 데이터는 fold-chunked (forecasting_vitaldb_ecg_ctx30s_tgt10s_fold{F}_{split}
    # _chunk{C}.pt) → prefix(.pt 없음) + n_folds=5. run.py 가 fold 별 test chunk 로드.
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/forecasting/forecasting_vitaldb_ecg_ctx30s_tgt10s"
    modes: [linear_probe]      # placeholder — run.py 가 mode 인자 미사용(no_mode_arg)
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, sampling, attn_bias]
    n_folds: 5                 # fold-chunked 5-fold OOF (zero-shot eval, fold별 test)
    no_mode_arg: true          # forecasting run.py 는 --mode 없음
    no_lora_arg: true          # 학습 없음 → lora 인자 금지
    no_epochs_arg: true        # 학습 없음 → epochs/lr 금지
    no_batch_arg: true         # --batch-size 금지
    no_patch_arg: true         # --patch-size 금지
    no_device_arg: true        # forecast run.py 는 --device 미지원
    extra_args:
      signal-type: ecg         # paper canonical (main); appendix 는 abp/ppg/co2
      target-sec: [10]         # 단일 horizon

  # ── 6. Cross-Modal PPG->ABP Generation ── DROPPED (2026-06-21) ──
  # PPG-only cross-modal 생성(shape-only, LoRA+Conv decoder)이 유의미한 수준에
  # 도달하지 못함(train loss 정체, r 저조). generation 컬럼은 waveform_forecasting
  # (#4, intra-modal, 사전학습 next-pred head)으로 대체. 코드(cross_modal/run.py
  # generate/linear_probe/lora 모드)는 reference 로 유지. 되살리려면 주석 해제.
  # - name: cross_modal_ppg_abp
  #   category: generation
  #   module: downstream.generation.cross_modal.run
  #   data_path: "${env:DOWNSTREAM_DATA_ROOT}/cross_modal_recon/cross_modal_vitaldb_ecg_abp_ppg_w30s"
  #   modes: [linear_probe, lora]
  #   applies_to_groups: [baseline, loss_component, lscnorm, cross_modal, phase_stage, attn_bias]
  #   n_folds: 5
  #   no_patch_arg: true
  #   extra_args: {model-version: v2, scenario: "PPG->ABP"}

  # ── 5. Intracranial Hypertension (Acute, ICP) ────────────────────
  # ABP+ECG+ICP, w900s(15min)/h30min (paper canonical). 데이터 fold-chunked
  # (intracranial_hypertension_abp_ecg_icp_w900s_h30min_fold{F}_{split}_chunk{C}.pt)
  # → prefix(.pt 없음) + n_folds=5. sparse 코호트(~100-130명)라 linear_probe 만
  # (LoRA 학습 분산 큼). standard eval. CI 넓을 수 있음(작은 코호트 수용).
  - name: ich
    category: acute_event
    module: downstream.acute_event.intracranial_hypertension.run
    data_path: "${env:DOWNSTREAM_DATA_ROOT}/intracranial_hypertension/intracranial_hypertension_abp_ecg_icp_w900s_h30min"
    modes: [linear_probe]
    applies_to_groups: [baseline, loss_component, lscnorm, cross_modal,
                        phase_stage, attn_bias]
    n_folds: 5                 # fold-chunked 5-fold OOF
    batch_size: 32
    extra_args:
      model-version: v2
      eval-mode: standard
