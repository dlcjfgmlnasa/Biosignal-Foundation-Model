# Phase 1: Channel-Independent Pre-training — K-MIMIC + SNUH 2026 (멀티소스 shard backend, Option A)
# ──────────────────────────────────────────────────────────────
# Server: 4×L40S 44GB (canonical run = 4-GPU DDP)
# Corpus: K-MIMIC ICU 725pt(1.203B tok) + SNUH 2026 OR+ICU 4개월(0.648B tok) = ~1.85B tokens (+54%)
#         물리병합·재샤딩 없이 다중 소스 라우팅 (commit 8e9301c, feat/multisource-shard).
#
# ⚠️ 이 config는 run1 = "신규 코퍼스 + 현 conditioning" clean baseline 입니다.
#     conditioning A/B 플래그(gate_unitless_cond·enrich_cond_peak)를 **설정하지 않음**
#     = ModelConfig 기본 False = 현 conditioning 그대로. (A/B는 별도 lineage run2.)
#
# ⚠️⚠️ LEAKAGE (실행 전 필수): SNUH ICU 가 Ventilation·SCOPE·Massive-Transfusion eval
#     코호트와 환자 중복 가능. 멀티소스 결합은 이 필터를 제공하지 않으므로, **재-pretrain
#     전에 SNUH manifest_full.jsonl 에서 겹치는 환자를 배제**하거나 해당 downstream test
#     fold 를 pretrain 환자와 disjoint 로 보장할 것. (방식 무관 blocking 데이터 조건.)
#
# 멀티소스 규약:
#   * data_dir 와 shard_index_path 는 **같은 순서의 병렬 리스트** (source i ↔ index i).
#   * source_dirs 는 train 스크립트가 data_dir(list)에서 자동 도출 → 각 소스 manifest 를
#     data_dir[i]/manifest_full.jsonl 에서 authoritative resolve (저장된 절대경로 무시).
#   * 소스별 로컬 shard 키는 (src, shard_id) 캐시키로 격리 → 충돌 없음.
#
# Usage (4-GPU DDP):
#   export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#   torchrun --nproc_per_node=4 -m train.1_channel_independency \
#       --config configs/phase1_combined_snuh.yaml
#   resume: 위 명령에 --resume <checkpoints/..._best.pt> 추가
#
# Smoke test (라우팅·coverage assert·소스별 recording 수 검증):
#   python -m train.1_channel_independency --config configs/phase1_combined_snuh.yaml --dry-run

# ── 모델 (Main: d=384, L=16, ~30M params / 30.21M — Phase 1 K-MIMIC와 동일) ──
model_config:
  d_model: 384
  num_layers: 16
  patch_size: 200            # 100Hz × 2초 = 200 samples/patch (300 patches/10min)
  stride: null               # non-overlapping (= patch_size)
  num_heads: 6               # head_dim = 384/6 = 64
  num_groups: null           # MHA (= num_heads)
  num_signal_types: 9        # v2 단일 modality 9종 (ECG0~RESP_Flow8, 2026-06-23 PAP 제거)
  use_glu: true
  use_moe: false             # Phase 1 CI에서는 off
  use_rope: true
  use_var_attn_bias: true
  use_spatial_embed: true
  dropout_p: 0.1

  # ── Task heads ──
  next_block_size: 3         # Block Next Prediction K=3 — 미래 6s (3 patch × 2s), 호흡 1주기
  contrastive_proj_dim: 0    # Contrastive (Phase 2에서 활성)

# ── 데이터 (멀티소스: K-MIMIC + SNUH 4개월) ──
# ⚠️ 순서 = shard_index_path 와 1:1 병렬. 서버 SNUH 경로가 다르면 두 리스트를 함께 수정.
data_dir:
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/k_mimic/
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/processed/202602/
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/processed/202603/
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/processed/202604/
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/processed/202606/
signal_types: [0, 1, 2, 3, 4, 5, 6, 7, 8]  # ECG ABP PPG CVP CO2 AWP ICP RESP_Imp RESP_Flow (v2 9종, PAP는 remap_record_v2가 load-time drop)
max_subjects: null
window_seconds: 600.0          # 10분 윈도우
max_length: 64000              # CI: 10분 윈도우(60000) + patch 정렬 여유
cache_size: 16
crop_ratio_min: 0.01           # 이론상 6s (실효는 min_patches floor에 의해 10s)
crop_ratio_max: 1.0
min_patches: 5                 # 임상 최소 입력 — 10s floor (patch_size=200 × 5 / 100Hz)

# ── Modality-balanced sampling (√-inverse, sparse modality 보정) ──
# 결합 코퍼스 전체 manifest 로 가중치 재계산 → SNUH ICU 가 보강하는 CVP/ICP/RESP_Imp 반영.
modality_balanced_alpha: 0.5         # p_m ∝ n_m^(1-α); 0.5 = 제곱근 tempering
modality_balanced_w_max_ratio: 5.0   # recording 가중치 상한 = 5 × mean(w)

# ── Shard backend (멀티소스 — data_dir 와 병렬 순서) ──
# ⚠️ shard_cache_size 는 PER WORKER · (src,shard_id) 캐시키. locality sampler 가 소스별로
#    shard 를 연속 read → 1-slot 유지 가능. SNUH shard 도 ~500MB/개.
shard_index_path:
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/k_mimic_shard_500mb/shard_index.json
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/sharded/202602/shard_index.json
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/sharded/202603/shard_index.json
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/sharded/202604/shard_index.json
  - /home/coder/workspace/k-mimic-/bio_fm/data/train/snuh/sharded/202606/shard_index.json
shard_cache_size: 1            # OOM 회피 (locality sampler 가 sequential read 보장)

# ── 학습 ──
# ⚠️ 코퍼스가 1.203B→~1.85B (+54%). 아래는 K-MIMIC 레시피 그대로(=same recipe, more data).
#    동일 revisit 유지를 원하면 max_batches/n_epochs 를 ~1.5× 상향 검토 (예산·과적합 트레이드오프).
batch_size: 96                 # L40S 44GB
lr: 8.0e-4
weight_decay: 0.1              # AdamW decoupled WD (2D+ 텐서만)
n_epochs: 40                   # 부족 시 --resume 연장
warmup_epochs: 4
min_lr_ratio: 0.1              # 최종 LR = 8e-5
mask_ratio: 0.4                # 40% 패치 마스킹
gradient_clip: 1.0
seed: 42
collate_mode: ci
max_batches: 4000              # 4-GPU(global 384) 기준. 2-GPU면 8000. (+54% 코퍼스면 ~6000 검토)

# ── Loss 가중치 (Phase 1: MPM + Next-Pred) ──
alpha: 1.0                     # masked reconstruction
beta: 0.8                      # next-pred
gamma: 0.0                     # cross-modal (Phase 2에서 활성)
delta: 0.0                     # contrastive (Phase 2에서 활성)
lambda_spec: 0.2               # Multi-Resolution STFT Loss
peak_alpha: 1.0                # Peak-Weighted MSE — R-peak 강화
aux_loss_weight: 0.01
contrastive_temperature: 0.07
learnable_temperature: true

# ── Masking (Block MPM) ──
variate_mask_prob: 0.0         # Phase 1은 비활성
block_mask: true               # 연속 블록 단위 마스킹
block_size_min: 3              # 최소 3패치(6초) — 호흡계 1 cycle 보장
block_size_max: 8              # 최대 8패치(16초)

# ── Mixed Precision ──
use_amp: true                  # L40S BF16/FP16 tensor cores

# ── Validation & Early Stopping ──
val_ratio: 0.05                # subject 단위 5% validation (path-parent 키 → 소스 disjoint)
val_max_batches: 500
patience: 10

# ── 시스템 ──
device: auto
num_workers: 4                 # 보수적 (안정 후 8 가능)
output_dir: /home/coder/workspace/k-mimic-/bio_fm/outputs/main/phase1_combined_snuh
checkpoint_every: 5
viz_every: 1
exp_name: combined_snuh_d384_L16_10min_p200_k2
